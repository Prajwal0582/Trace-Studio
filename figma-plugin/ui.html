<style>
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 16px; color: #222; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  p { color: #666; margin: 0 0 12px; }
  textarea { width: 100%; height: 300px; font: 11px ui-monospace, monospace; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 14px; background: #0d99ff; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #out { margin-top: 10px; white-space: pre-wrap; font: 11px ui-monospace, monospace; }
</style>
<h2>Trace Importer</h2>
<p>Choose the <code>plan.json</code> from <code>.trace/&lt;session&gt;/</code> or paste it below.</p>
<input type="file" id="file" accept=".json" />
<textarea id="plan" placeholder="{ &quot;tool&quot;: &quot;trace&quot;, ... }"></textarea>
<label><input type="checkbox" id="notes" checked /> Add handoff-notes panels</label><br />
<button id="build">Build screens</button>
<div id="out"></div>
<script>
  const $ = (id) => document.getElementById(id);
  $("file").onchange = async (e) => ($("plan").value = await e.target.files[0].text());
  $("build").onclick = () => {
    $("out").textContent = "Building…";
    parent.postMessage({ pluginMessage: { type: "build", plan: $("plan").value, notes: $("notes").checked } }, "*");
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (m.type === "error") $("out").textContent = "Error: " + m.message;
    if (m.type === "done") {
      const r = m.report;
      $("out").textContent =
        `✓ ${r.frames.length} screens · ${r.instances} instances · ${r.texts} texts · ${r.links} links\n` +
        `⚠ ${r.placeholders} placeholders to review\n` +
        (r.failures.length ? "\nIssues:\n- " + r.failures.join("\n- ") : "");
    }
  };
</script>
